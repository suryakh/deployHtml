
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rancher Deployment Demo</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 40px;
            max-width: 600px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            background: #166534;
            color: #bbf7d0;
            padding: 10px 20px;
            border-radius: 25px;
            margin-top: 20px;
        }

        .info {
            margin-top: 30px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Hello, Kubernetes!</h1>

        <p>
            Welcome to my first application deployed
            using Docker and Rancher.
        </p>

        <div class="status">
            ● Application is Running
        </div>

        <div class="info">
            <p>Project: Rancher HTML Demo</p>
            <p>Technology: HTML + Docker + Kubernetes</p>
            <p>Deployment: Rancher</p>
        </div>
    </div>
</body>
</html>
